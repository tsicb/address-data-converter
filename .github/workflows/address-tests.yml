name: Address Converter Tests

on:
  push:
    branches: [main]
    paths:
      - 'address-core.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/address-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'address-core.js'
      - 'index.html'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run representative tests
        run: node tests/run-tests.js
